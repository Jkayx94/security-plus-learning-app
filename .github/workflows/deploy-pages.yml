name: Build and deploy Security+ PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract app source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "No ZIP file found in the repository. Upload security-plus-learning-pwa-prototype.zip to the repository root."
            exit 1
          fi
          mkdir -p app
          unzip -q "$ZIP_FILE" -d extracted
          PACKAGE=$(find extracted -type f -name package.json | head -n 1)
          if [ -z "${PACKAGE:-}" ]; then
            echo "No package.json found inside $ZIP_FILE"
            exit 1
          fi
          APP_DIR=$(dirname "$PACKAGE")
          cp -a "$APP_DIR"/. app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Validate content
        working-directory: app
        run: npm run validate

      - name: Build
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
