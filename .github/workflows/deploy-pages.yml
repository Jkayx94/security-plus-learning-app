name: Build and deploy Security+ PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "No ZIP archive found in the repository root"
            ls -la
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          rm -rf extracted app
          mkdir -p extracted app
          unzip -q "$ZIP_FILE" -d extracted
          PACKAGE_FILE=$(find extracted -type f -name package.json ! -path '*/tools/*' | head -n 1)
          if [ -z "${PACKAGE_FILE:-}" ]; then
            echo "No application package.json found inside $ZIP_FILE"
            exit 1
          fi
          APP_DIR=$(dirname "$PACKAGE_FILE")
          cp -a "$APP_DIR"/. app/
          test -f app/package-lock.json
          test -f app/src/app.ts
          test -f app/src/styles.css
          test -f app/public/manifest.webmanifest
          test -f app/public/sw.js

      - name: Apply public app and mobile UI update
        run: python3 scripts/patch-mobile-ui.py app/src/app.ts app/src/styles.css

      - name: Apply generated question safeguards
        run: python3 scripts/patch-question-quality.py app/src/app.ts

      - name: Apply post-answer feedback flow
        run: python3 scripts/patch-answer-feedback-flow.py app/src/app.ts app/src/styles.css

      - name: Set v2.2.1 and robust update handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/src/app.ts', 'app/public/manifest.webmanifest'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('2.2.0', '2.2.1')
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/patch-service-worker-update.py app/public/sw.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate, test, type-check and build
        working-directory: app
        run: npm run build

      - name: Run production feature audit
        run: node scripts/feature-audit.mjs app/dist

      - name: Verify production output
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q "Flag this question" dist/assets/app.js
          grep -q "Did you know it?" dist/assets/app.js
          grep -q "Why this answer is correct" dist/assets/app.js
          grep -q "What should we call you" dist/assets/app.js
          grep -q "Security+ Adaptive Learning" dist/assets/app.js
          grep -q "objective-path-recognition" dist/assets/app.js
          grep -q "document.querySelector('nav')?.remove" dist/assets/app.js
          grep -q "2.2.1" dist/assets/app.js
          grep -q "security-plus-v2.2.1" dist/sw.js
          grep -q "request.mode === 'navigate'" dist/sw.js
          grep -q "cache: 'no-store'" dist/sw.js
          if grep -q "A scenario points to" dist/assets/app.js; then
            echo "Invalid fabricated scenario generator remains"
            exit 1
          fi
          if grep -q "How confident are you?</b>" dist/assets/app.js; then
            echo "Pre-answer confidence prompt remains"
            exit 1
          fi
          node --check dist/assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
