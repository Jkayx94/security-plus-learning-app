name: Build and deploy Security+ v3.2.1

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/build-status/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, type-check and build
        run: npm run build

      - name: Install rendered-test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Rendered Samsung portrait interaction audit
        run: node scripts/rendered-mobile-v3.2.1.mjs

      - name: Production and service-worker audit
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/engine/notification-queue.js
          test -f dist/assets/engine/test-sandbox.js
          test -f dist/assets/styles.css
          test -f dist/sw.js
          grep -q "3.2.1" dist/assets/app.js
          grep -q "security-plus-v3.2.1" dist/sw.js
          grep -q "NotificationQueue" dist/assets/app.js
          grep -q "appNotificationHost" dist/assets/app.js
          grep -q "dismiss-notification" dist/assets/app.js
          grep -q "Tap the version five times to enable local testing tools" dist/assets/app.js
          grep -q "UNLOCK EVERYTHING FOR TESTING" dist/assets/app.js
          grep -q "Developer Lab" dist/assets/app.js
          grep -q "JAKE-SECPLUS-TEST" dist/assets/app.js
          grep -q "sanitiseTestState" dist/assets/app.js
          grep -q "SKIP_WAITING" dist/sw.js
          grep -q "clients.claim" dist/sw.js
          grep -q "prefers-reduced-motion" dist/assets/styles.css
          node --check dist/assets/app.js
          node --check dist/assets/engine/notification-queue.js
          node --check dist/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          mkdir -p .github/build-status
          cat > .github/build-status/v3.2.1.json <<EOF
          {
            "version": "3.2.1",
            "sourceCommit": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "pagesUrl": "${PAGE_URL}",
            "status": "deployed"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/v3.2.1.json
          git commit -m "Record successful v3.2.1 deployment" || exit 0
          git push origin HEAD:main
