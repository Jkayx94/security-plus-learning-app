name: Build and deploy Security+ PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="security-plus-learning-pwa-prototype.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Missing $ZIP_FILE in the repository root."
            exit 1
          fi

          rm -rf app extracted
          mkdir -p app extracted
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE=$(find extracted -type f -name package.json | head -n 1)
          if [ -z "${PACKAGE:-}" ]; then
            echo "No package.json found inside $ZIP_FILE"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE")
          cp -a "$APP_DIR"/. app/

          # Fix the generated TypeScript callback parameter before compilation.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'setIndex={(i)=>{setQIndex(i);'
          new = 'setIndex={(i: number)=>{setQIndex(i);'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected setIndex callback was not found in src/App.tsx')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Validate content
        working-directory: app
        run: npm run validate

      - name: Build
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
