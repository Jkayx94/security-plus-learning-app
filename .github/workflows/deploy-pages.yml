name: Build and deploy Security+ v3.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.2 platform migration
        run: python3 scripts/apply-v3.2-platform-content.py src/app.ts src/styles.css

      - name: Set v3.2 manifest and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('public/manifest.webmanifest')
          m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'3\.[01]\.\d+|2\.\d+\.\d+','3.2.0',m)
          manifest.write_text(m,encoding='utf-8')
          sw=Path('public/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"security-plus-v[^'\"]+",'security-plus-v3.2.0',s)
          sw.write_text(s,encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, type-check and build
        run: npm run build

      - name: Production UI and content audit
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/content/loader.js
          test -f dist/assets/content/security-plus-v3.2.js
          test -f dist/assets/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q "3.2.0" dist/assets/app.js
          grep -q "security-plus-v3.2.0" dist/sw.js
          grep -q "<small>More</small>" dist/assets/app.js
          grep -q "Backup and restore" dist/assets/app.js
          grep -q "Export complete progress" dist/assets/app.js
          grep -q "Progress exported successfully" dist/assets/app.js
          grep -q "Developer Lab" dist/assets/app.js
          grep -q "JAKE-SECPLUS-TEST" dist/assets/app.js
          grep -q "loadContentPack" dist/assets/app.js
          grep -q "approvedForBoss" dist/assets/content/loader.js
          ! grep -q "selecting the most precise SY0-701 term" dist/assets/app.js
          ! grep -q "generated-fallback" dist/assets/app.js
          grep -q "prefers-reduced-motion" dist/assets/styles.css
          test -f reports/question-inventory-v3.2.json
          test -f reports/concepts-with-no-valid-question-v3.2.json
          node --check dist/assets/app.js
          node --check dist/assets/content/loader.js

      - name: Commit canonical v3.2 source and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/styles.css public/manifest.webmanifest public/sw.js reports/
          if ! git diff --cached --quiet; then
            git commit -m "Apply Security+ v3.2 platform and content infrastructure [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
