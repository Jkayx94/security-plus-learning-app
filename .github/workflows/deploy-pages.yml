name: Build and deploy Security+ v3.0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, type-check and build
        run: npm run build

      - name: Verify v3.0.2 production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q "3.0.2" dist/assets/app.js
          grep -q "security-plus-v3.0.2" dist/sw.js
          grep -q "Visual test laboratory" dist/assets/app.js
          grep -q "Profile shield" dist/assets/app.js
          grep -q "Text battle display" dist/assets/app.js
          grep -q "SECURITY WRAITH" dist/assets/app.js
          grep -q "Typography" dist/assets/app.js
          grep -q "Overlay previews" dist/assets/app.js
          grep -q "Boss previews" dist/assets/app.js
          grep -q "JAKE-SECPLUS-TEST" dist/assets/app.js
          grep -q "prefers-reduced-motion" dist/assets/styles.css
          node --check dist/assets/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
