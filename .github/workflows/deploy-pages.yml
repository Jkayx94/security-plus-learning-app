name: Build and deploy Security+ PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="security-plus-learning-pwa-prototype.zip"
          unzip -t "$ZIP_FILE"
          rm -rf extracted app
          mkdir -p extracted app
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE=$(find extracted -type f -name package.json | head -n 1)
          if [ -z "${PACKAGE_FILE:-}" ]; then
            echo "No package.json found inside $ZIP_FILE"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")
          cp -a "$APP_DIR"/. app/

          python3 - <<'PY'
          from pathlib import Path

          app = Path('app')
          app_tsx = app / 'src' / 'App.tsx'
          text = app_tsx.read_text(encoding='utf-8')
          replacements = [
              ('setIndex={i=>{setQIndex(i);', 'setIndex={(i: number)=>{setQIndex(i);'),
              ('setIndex={(i)=>{setQIndex(i);', 'setIndex={(i: number)=>{setQIndex(i);'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  break
          app_tsx.write_text(text, encoding='utf-8')

          vite = app / 'vite.config.ts'
          if vite.exists():
              v = vite.read_text(encoding='utf-8')
              if 'base:' not in v:
                  v = v.replace('defineConfig({', "defineConfig({\n  base: '/security-plus-learning-app/',", 1)
              vite.write_text(v, encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Validate content
        working-directory: app
        run: npm run validate

      - name: Build
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
