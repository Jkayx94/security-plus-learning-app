name: Build and deploy Security+ v3.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.1 learning engine completion
        run: python3 scripts/apply-v3.1-learning-engine.py src/app.ts src/styles.css

      - name: Set v3.1 manifest and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('public/manifest.webmanifest')
          m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'3\.0\.2|3\.0\.1|3\.0\.0','3.1.0',m)
          manifest.write_text(m,encoding='utf-8')
          sw=Path('public/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"security-plus-v[^'\"]+",'security-plus-v3.1.0',s)
          sw.write_text(s,encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, type-check and build
        run: npm run build

      - name: Verify v3.1 production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q "3.1.0" dist/assets/app.js
          grep -q "security-plus-v3.1.0" dist/sw.js
          grep -q "Correct, but low confidence" dist/assets/app.js
          grep -q "Why your selected answer was tempting" dist/assets/app.js
          grep -q "Why each other option is wrong" dist/assets/app.js
          grep -q "Boss health" dist/assets/app.js
          grep -q "Learner shield" dist/assets/app.js
          grep -q "Start targeted review" dist/assets/app.js
          grep -q "Developer Lab" dist/assets/app.js
          grep -q "JAKE-SECPLUS-TEST" dist/assets/app.js
          grep -q "Cosmetics" dist/assets/app.js
          grep -q "version-tap" dist/assets/app.js
          grep -q "reward:150" scripts/progression-rules.mjs
          grep -q "questions:5" scripts/progression-rules.mjs
          grep -q "prefers-reduced-motion" dist/assets/styles.css
          node --check dist/assets/app.js

      - name: Commit canonical v3.1 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/styles.css public/manifest.webmanifest public/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Apply Security+ v3.1 learning engine [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
