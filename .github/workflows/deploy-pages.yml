name: Build and deploy Security+ v3.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, type-check, build and audit
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            npm run build
            test -f dist/index.html
            test -f dist/assets/app.js
            test -f dist/assets/styles.css
            test -f dist/manifest.webmanifest
            test -f dist/sw.js
            test -f dist/icons/icon-192.png
            test -f dist/icons/icon-512.png
            grep -q "3.1.0" dist/assets/app.js
            grep -q "security-plus-v3.1.0" dist/sw.js
            grep -q "Correct, but low confidence" dist/assets/app.js
            grep -q "Why your selected answer was tempting" dist/assets/app.js
            grep -q "Why each other option is wrong" dist/assets/app.js
            grep -q "Boss health" dist/assets/app.js
            grep -q "shieldMarkup" dist/assets/app.js
            grep -q "bossConsole" dist/assets/app.js
            grep -q "Start targeted review" dist/assets/app.js
            grep -q "Developer Lab" dist/assets/app.js
            grep -q "JAKE-SECPLUS-TEST" dist/assets/app.js
            grep -q "Cosmetics" dist/assets/app.js
            grep -q "version-tap" dist/assets/app.js
            grep -q "reward:150" scripts/progression-rules.mjs
            grep -q "questions:5" scripts/progression-rules.mjs
            grep -q "prefers-reduced-motion" dist/assets/styles.css
            node --check dist/assets/app.js
          ) > v3.1-direct-build.log 2>&1
          code=$?
          cat v3.1-direct-build.log
          if [ $code -ne 0 ]; then
            cp v3.1-direct-build.log V3_1_BUILD_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add V3_1_BUILD_ERROR.txt
            git commit -m "Record direct v3.1 build failure [skip ci]" || true
            git push origin HEAD:main || true
            exit $code
          fi

      - name: Record passed build
        shell: bash
        run: |
          cat > V3_1_BUILD_PASSED.md <<EOF
          # Security+ v3.1 Build Passed

          Version: 3.1.0
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID
          Validation: passed
          Automated tests: passed
          TypeScript compilation: passed
          Production build: passed
          JavaScript syntax validation: passed
          Production feature audit: passed
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f V3_1_BUILD_ERROR.txt
          git add V3_1_BUILD_PASSED.md
          git add -u -- V3_1_BUILD_ERROR.txt 2>/dev/null || true
          git commit -m "Record Security+ v3.1 build success [skip ci]" || true
          git push origin HEAD:main || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
